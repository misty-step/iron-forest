# forest.secrets.yaml — the explicit exclusion list for legitimate credential-
# shaped fixtures, read by `forest scan-secrets`. It stays narrow and names
# content files only; it is not the protected-path list that docs/adr/0003
# removed. A path here is a deliberate, reviewed fixture — never a whole feature
# area — and the generic detector still scans every other byte of the worktree.
exclude:
  - config_test.go