# forest.secrets.yaml — content-scan exclusions for `forest scan-secrets`.
#
# This is the exclusion path for legitimate fixtures: files that carry the
# factory's own Mint markers and proxy host because the operator owns them, not
# because a run leaked them into a worktree. It is deliberately narrow and names
# content only; it is not a return of the protected-path list (docs/adr/0003).
#
# Everything else in the working tree is scanned, untracked paths included.
# In particular .opencode/agents/ is NOT excluded, so a rendered declaration that
# an earlier step ever wrote back into the tree is still caught.
exclude:
  # The factory's own provider route and key alias, committed as configuration.
  - .opencode/opencode.json
  # The factory's own agent declarations, which declare Mint markers and the
  # proxy host for their MCP servers.
  - agents/
  # The scanner's own source names the marker shapes and proxy host it must
  # detect, and its tests (and the existing harness test) use them as fixtures.
  # These are the detector and its fixtures, not a leak, so they are excluded.
  - scansecrets.go
  - scansecrets_test.go
  - harness_test.go
