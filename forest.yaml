# iron-forest — the factory's own composition file.
# Flows are independent lanes. They coordinate only through leases and notes in
# this repository, so concurrency needs no scheduler.
repo: misty-step/iron-forest

# Paths no agent may write. The gate rejects a run that touches one.
protected:
  - .forest/
  - forest.yaml
  - agents/
  - .opencode/opencode.json

# A lease older than this may be broken, so a dead host cannot own a subject
# forever.
lease:
  ttl_seconds: 7200

# The checks Iron Forest runs itself. The result is a note on the commit, not a
# status read back from a host.
checks:
  - name: build
    run: mise exec -- go build ./...
  - name: vet
    run: mise exec -- go vet ./...
  - name: test
    run: mise exec -- go test ./...

flows:
  builder:
    enabled: true
    agent: builder
    interval_seconds: 30
    exclude_labels: [parked, "forest:failed"]
  verifier:
    enabled: true
    agent: verifier
    interval_seconds: 20
    merge: squash
    auto_merge: true
  fixer:
    enabled: true
    agent: builder
    interval_seconds: 40
    attempts: 2

# The human-facing surface. One way out: Iron Forest never reads it back.
projection:
  enabled: true
  merge_via_host: false
