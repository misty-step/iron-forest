# iron-forest backlog polling and PR factory
#
# This file declares the workflow: which agents run which phase, the poll
# cadence, and which paths are off limits to every agent. Agent definitions
# (model, permissions, MCPs, prompts, output contract) live in agents/<name>/.

repo: misty-step/iron-forest

# Poll: seconds between passes over the backlog. One item at a time.
poll_interval_seconds: 30

# Factory-wide gate: no agent may change these paths. The per-agent tool
# permissions live in each agents/<name>/agent.yaml.
protected:
  - .forest/
  - forest.yaml
  - agents/
  - .opencode/opencode.json

# The workflow. Each named agent is a directory under agents/. The build agent
# implements the change; the review agent ("" disables review) checks it; when
# review asks for changes, the build agent gets max_fix_iterations corrective
# passes before the verdict is final.
workflow:
  build: forester
  review: ranger
  max_fix_iterations: 1
