repo: misty-step/iron-forest        # forge identity (owner/name)
agents:
  builder:  { poll: "./forest poll builder",  interval: 300, timeout: 3600 }
  verifier: { poll: "./forest poll verifier", interval: 120, timeout: 1800 }
  fixer:    { poll: "./forest poll fixer",    interval: 300, timeout: 3600 }
checks:
  - name: build
    run: mise exec -- go build ./...
  - name: vet
    run: mise exec -- go vet ./...
  - name: test
    run: mise exec -- go test ./...
  # A published branch must never carry credential material. The generic
  # high-entropy scan runs over the whole worktree (untracked files included)
  # and fails closed when the trufflehog scanner is absent rather than silently
  # narrowing. Legitimate fixtures are excluded in forest.secrets.yaml.
  - name: secrets
    run: mise exec -- go run . scan-secrets .
