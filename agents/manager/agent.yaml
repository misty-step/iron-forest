# manager: one unstarted assignment into the ready queue.
#
# This lane judges only the candidate set deterministic code has already filtered:
# it ranks the items it is offered and returns one pick. It never writes a branch,
# label, comment, or merge; the controller applies the one label. The run directory
# is a throwaway empty dir, so the agent receives no repository context.
description: "The Manager picks one unstarted item from a filtered candidate set."
commit:
  name: "Iron Forest Manager"
  email: "manager@iron-forest.invalid"
harness: opencode
mode: primary
model: openrouter-mint/deepseek-v4-flash-0731
temperature: 0.2
# A wall-clock deadline bounds every stall (see #207): time-bound only, never a
# step ceiling. Runs that exceed this are cancelled and recorded as
# timeout_failed.
deadline_seconds: 3600
# The Manager writes only report.json in its throwaway run directory. It has no
# repository context, credentials, network tools, MCP tools, or shell commands.
permission:
  read: allow
  edit: allow
  glob: allow
  grep: allow
  list: allow
  lsp: allow
  webfetch: deny
  websearch: deny
  task: deny
  skill: deny
  todowrite: deny
  external_directory: deny
  question: deny
bash_allow: []
# Exa remains declared for shared wiring but disabled for this offline lane.
mcp:
  - name: exa
    type: remote
    url: http://mint.tail5f5eb4.ts.net:4949/proxy/https/mcp.exa.ai/mcp
    header: __mint.exa.default__
    enabled: false
