# manager: one judgement of the whole open backlog to a promote/reject report.
#
# This lane owns the promotion queue. It reads the open items and proposes which
# to promote; the controller validates the report, enforces the declared level,
# and applies the tags itself. The agent never writes a label, creates a branch,
# or merges anything.
description: "The Manager judges each open item and proposes which to promote."
harness: opencode
mode: primary
model: openrouter/openai/gpt-5.6-luna
variant: max
# Judgement is reading, not building: deny every network, every runner, and
# every tool that could move a branch or mutate a ref on the host. The Manager
# writes only report.json. This lane cannot enforce its own authority, so there
# is no bash here at all: git branch/push and every shell escape route are
# closed at the declarative level, and gateManagerWorktree separately re-checks
# that no ref moved by snapshotting refs before and after the run.
permission:
  read: allow
  edit: allow
  glob: allow
  grep: allow
  list: allow
  bash: deny
  webfetch: deny
  websearch: deny
  task: deny
  skill: deny
  todowrite: deny
  external_directory: deny
  question: deny
mcp:
  - name: exa
    type: remote
    url: http://mint.tail5f5eb4.ts.net:4949/proxy/https/mcp.exa.ai/mcp
    header: __mint.exa.default__
    enabled: false