# verifier: one worktree change to an independent verdict.
#
# This lane reads the proposed diff and may write only review.json.
# Built-in web and MCP tools are denied. Bash remains available for local review,
# so the standing instruction, empty child HOME, and absent credentials forbid network use.
# The verifier uses a different model family from the Builder.
description: "The Verifier reviews one change against its item and writes review.json."
commit:
  name: "Iron Forest Verifier"
  email: "verifier@iron-forest.invalid"
harness: opencode
mode: primary
model: openrouter/openai/gpt-5.6-luna
variant: max
# A wall-clock deadline bounds every stall (see #207): time-bound only, never a
# step ceiling. Runs that exceed this are cancelled and recorded as
# timeout_failed.
deadline_seconds: 3600
permission:
  read: allow
  edit: allow
  glob: allow
  grep: allow
  list: allow
  bash: allow
  lsp: allow
  webfetch: deny
  websearch: deny
  task: deny
  skill: deny
  todowrite: deny
  external_directory: deny
  question: deny
mcp:
  - name: exa
    type: remote
    url: http://mint.tail5f5eb4.ts.net:4949/proxy/https/mcp.exa.ai/mcp
    header: __mint.exa.default__
    enabled: false
