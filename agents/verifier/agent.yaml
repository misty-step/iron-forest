# verifier: one worktree change to an independent verdict.
#
# This lane reads the proposed diff and may write only review.json.
# Built-in web and MCP tools are denied. Bash is bounded to the commands named
# below, so local review can still inspect the diff and run the declared checks
# without giving an agent an unbounded shell: the rendered `bash` permission and
# the run's sandbox `bash` together refuse any command that is not a plain
# allowlisted command, so chaining, substitution, redirection, and paths outside
# the worktree cannot smuggle an unlisted command in. The standing instruction,
# empty child HOME, and absent credentials forbid network use.
# The verifier uses a different model family from the Builder.
description: "The Verifier reviews one change against its item and writes review.json."
commit:
  name: "Iron Forest Verifier"
  email: "verifier@iron-forest.invalid"
harness: opencode
mode: primary
model: openrouter/openai/gpt-5.6-luna
variant: max
# A wall-clock deadline bounds every stall (see #207): time-bound only, never a
# step ceiling. Runs that exceed this are cancelled and recorded as
# timeout_failed.
deadline_seconds: 3600
permission:
  read: allow
  edit: allow
  glob: allow
  grep: allow
  list: allow
  lsp: allow
  webfetch: deny
  websearch: deny
  task: deny
  skill: deny
  todowrite: deny
  external_directory: deny
  question: deny
bash_allow:
  - "git *"
  - "go build *"
  - "go test *"
  - "go vet *"
  - "mise exec -- go build *"
  - "mise exec -- go test *"
  - "mise exec -- go vet *"
  - "echo *"
  - "ls *"
  - "cat *"
  - "tail *"
  - "head *"
mcp:
  - name: exa
    type: remote
    url: http://mint.tail5f5eb4.ts.net:4949/proxy/https/mcp.exa.ai/mcp
    header: __mint.exa.default__
    enabled: false
