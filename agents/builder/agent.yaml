# builder: one tracker item to a worktree change and report.json.
#
# This declaration defines the runtime, powers, MCP wiring, and output contract.
# Prompts and skills remain separate files so each run is inspectable.
description: "The Builder implements one item in a worktree and writes report.json."
commit:
  name: "Iron Forest Builder"
  email: "builder@iron-forest.invalid"
harness: opencode
mode: primary
model: openrouter-mint/deepseek-v4-flash-0731
temperature: 0.2
# A wall-clock deadline bounds every stall, whatever its cause: a provider that
# accepts a connection and never answers would otherwise hold a lane forever
# (see #207). Time-bound only; there is no step ceiling. Runs that exceed this
# are cancelled and recorded as timeout_failed.
deadline_seconds: 3600
# OpenCode rejects every shell command outside this list. The run shell rejects
# shell syntax and paths outside the worktree before it executes an allowed
# command. Bubblewrap contains commands and every process they start.
permission:
  read: allow
  edit: allow
  glob: allow
  grep: allow
  list: allow
  lsp: allow
  todowrite: allow
  webfetch: deny
  websearch: deny
  task: deny
  skill: deny
  external_directory: deny
  question: ask
bash_allow:
  - "git *"
  - "gofmt *"
  - "go build *"
  - "go test *"
  - "go vet *"
  - "go fmt *"
  # OpenCode 1.18.11 has no BashArity entry for mise, so every mise command
  # requests this exact permission prefix.
  - "mise *"
# Exa remains declared for shared wiring but disabled for this offline lane.
mcp:
  - name: exa
    type: remote
    url: http://mint.tail5f5eb4.ts.net:4949/proxy/https/mcp.exa.ai/mcp
    header: __mint.exa.default__
    enabled: false
