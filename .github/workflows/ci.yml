name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: build
        run: mise exec -- go build ./...
      - name: vet
        run: mise exec -- go vet ./...
      - name: test
        run: mise exec -- go test ./...
