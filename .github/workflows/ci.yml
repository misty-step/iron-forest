name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan committed changes for secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: 3.96.0
          extra_args: --fail-on-scan-errors --results=verified,unknown,unverified

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: build
        run: mise exec -- go build ./...
      - name: vet
        run: mise exec -- go vet ./...
      - name: test
        run: mise exec -- go test ./...
      - name: version reports the built SHA
        run: |
          sha="$(git rev-parse HEAD)"
          commit_time="$(git show -s --format=%cI HEAD)"
          dirty="false"
          if [ -n "$(git status --porcelain)" ]; then dirty="true"; fi
          bin="$(mktemp -d)/forest"
          mise exec -- go build -ldflags "-X main.buildSHA=$sha -X main.buildTime=$commit_time -X main.buildDirty=$dirty" -o "$bin" .
          "$bin" version | grep -Fx "build_sha: $sha"
      # Mirrors the Kernel-owned credential scan. The Gate itself runs the
      # running Kernel binary against the detached candidate worktree and never
      # compiles candidate code for the scan; CI builds the scanner binary and
      # runs its scan-secrets command against the whole worktree (untracked
      # files included).
      - name: Install the generic secret scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/6f3c981e7b77f235fd2702dd74af25fc4b72bf11/scripts/install.sh \
            | sh -s -- -b /usr/local/bin v3.96.0
          trufflehog --version
      - name: Build the forest scanner
        run: mise exec -- go build -o /tmp/forest .
      - name: Scan for leaked credentials
        run: /tmp/forest scan-secrets .

  eval-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install uv
        run: pipx install uv==0.12.0
      - name: deterministic agent regressions
        run: ./evals/run-fast.sh
