name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Every check forest.yaml declares under `checks:` must run here. The
      # matching drift test (TestCIJobRunsExactlyTheForestChecks) fails when the
      # two lists disagree; selfcheck runs via `go run .` so it needs no binary.
      - run: go run . selfcheck
