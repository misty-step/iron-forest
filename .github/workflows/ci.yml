name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: build
        run: mise exec -- go build ./...
      - name: vet
        run: mise exec -- go vet ./...
      - name: test
        run: mise exec -- go test ./...
      # Mirrors the `secrets` check in forest.yaml. A merged branch must never
      # carry credential material; CI provisions the same generic scanner the
      # local check uses and scans the whole worktree (untracked files
      # included), so the merged gate is green only when the scan passes.
      - name: Install the generic secret scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/6f3c981e7b77f235fd2702dd74af25fc4b72bf11/scripts/install.sh \
            | sh -s -- -b /usr/local/bin v3.96.0
          trufflehog --version
      - name: Scan for leaked credentials
        run: mise exec -- go run . scan-secrets .

  eval-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install uv
        run: pipx install uv==0.12.0
      - name: deterministic agent regressions
        run: ./evals/run-fast.sh
