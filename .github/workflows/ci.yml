name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # A merged branch must never carry the factory's Mint markers or proxy host
      # anywhere but the operator-owned files excluded in forest.secrets.yaml.
      # CI provisions the same generic scanner the daemon's `secrets` check uses
      # and runs the full scan, so the merged gate is green only when the whole
      # scanner (content rules plus generic detection) passes, never a
      # --no-generic subset.
      - name: Install the generic secret scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version
      - name: Scan for leaked credentials
        run: go run . scan-secrets .
