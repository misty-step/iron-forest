name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # A merged branch must never carry the factory's Mint markers or proxy host
      # anywhere but the operator-owned files excluded in forest.secrets.yaml.
      # The daemon's own `secrets` check (see forest.yaml) runs the full scan and
      # fails closed when the generic scanner is absent; CI runs the built-in
      # content rules so the gate is green without an external binary.
      - name: Scan for leaked credentials
        run: go run . scan-secrets --no-generic .
